# One-click setup on Render (render.com): New → Blueprint → pick this repo.
# Two services: the Hoolam server (bot, console, trust pages) and the landing page (a free static site that never sleeps).
# Free plan: the server sleeps after 15 minutes without traffic and takes about a minute to wake up.
# Use the Starter plan once real money moves: the WhatsApp bot and the console then answer instantly.
services:
  - type: web
    name: hoolam
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # Supabase "Session pooler" connection string
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: fake          # pretend money until Monnify keys arrive
      - key: ALLOW_SELF_DEAL
        value: "true"        # one phone can play seller and buyer; reply "paid" to fake a transfer
      - key: WHATSAPP_DRY_RUN
        value: "false"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false          # the test number, digits only, e.g. 15551234567
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_WABA_ID
        sync: false          # WhatsApp Business Account ID: creates the buyer form and the seller alert
      - key: TRUST_COUNT_TEST_DEALS
        value: "true"        # testing with pretend money: let those deals show on trust cards. Remove for real money.
      - key: SITE_URL
        sync: false          # the landing page address; the server's own address (/) then sends visitors there
      - key: CONSOLE_URL
        sync: false          # https://console.hoolam.com once that domain is verified: the console only opens there
      - key: PUBLIC_BASE_URL
        sync: false          # https://go.hoolam.com: trust pages and deal links for buyers and sellers
      - key: PAY_URL
        sync: false          # https://pay.hoolam.com: short payment links (optional)
      - key: SITE_DEPLOY_HOOK
        sync: false          # the landing page's Deploy Hook URL (static site → Settings → Deploy Hook): logo, picture, fee and number changes rebuild it
      - key: WHATSAPP_FORM_MODE
        value: draft         # switch to "published" once Meta has verified your business

  # The landing page: plain files, served from Render's CDN. Free, never sleeps.
  # Point your domain (yourdomain.com and www) here; the server can live at app.yourdomain.com.
  - type: web
    name: hoolam-site
    runtime: static
    buildCommand: node site/build.mjs
    staticPublishPath: ./dist-site
    buildFilter:
      paths: [site/**]       # only rebuild when the landing page changes
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    envVars:
      - key: HOOLAM_APP_URL
        value: https://hoolam.onrender.com   # the server: live fees and the WhatsApp number come from here
      - key: WHATSAPP_PUBLIC_NUMBER
        fromService: { type: web, name: hoolam, envVarKey: WHATSAPP_PUBLIC_NUMBER }
      - key: SITE_URL
        sync: false          # this site's address once the domain is connected, e.g. https://hoolam.ng
